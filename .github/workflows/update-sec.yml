name: Refresh public SEC fundamentals
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
concurrency:
  group: sec-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate SEC data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node collector.cjs
      - name: Save successful snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          git diff --cached --quiet || git commit -m 'Refresh public SEC fundamentals'
          git push
