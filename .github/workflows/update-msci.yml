name: Refresh MSCI ratios
on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'
permissions:
  contents: write
concurrency:
  group: msci-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: node market.cjs
      - name: Save validated ratios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/msci.json
          git diff --cached --quiet || git commit -m 'Refresh public MSCI ratios'
          git pull --rebase origin main
          git push
